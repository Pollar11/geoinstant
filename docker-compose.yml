# docker compose up --build → http://localhost:3300
# Model/index artifacts go in ./inference/artifacts (see docs/DESIGN.md).
services:
  inference:
    build: ./inference
    environment:
      GEOINSTANT_PROXY_API_KEYS: '["${GEOINSTANT_PROXY_KEY:-change-me-proxy-key}"]'
      GEOINSTANT_VLM_MODE: ${GEOINSTANT_VLM_MODE:-enrich}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEOINSTANT_CORS_ORIGINS: '["http://localhost:3300"]'
      GEOINSTANT_ARCHIVE_TOKEN: ${ARCHIVE_TOKEN:-change-me-archive-token}
      GEOINSTANT_MAPILLARY_TOKEN: ${MAPILLARY_TOKEN:-}
      # Downloaded terrain and street-photo descriptors (safe to delete).
      GEOINSTANT_DEM_DIR: /cache/dem
      GEOINSTANT_STREETMATCH_DIR: /cache/streetmatch
    volumes:
      - ./inference/artifacts:/artifacts
      - feedback:/feedback
      - archive:/archive
      - cache:/cache
    # GPU hosts: uncomment and build with the GPU args in inference/Dockerfile.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    expose: ["8000"]

  web:
    build: ./web
    environment:
      INFERENCE_URL: http://inference:8000
      INFERENCE_API_KEY: ${GEOINSTANT_PROXY_KEY:-change-me-proxy-key}
      INFERENCE_ARCHIVE_TOKEN: ${ARCHIVE_TOKEN:-change-me-archive-token}
      ARCHIVE_PASSWORD: ${ARCHIVE_PASSWORD:?set ARCHIVE_PASSWORD for the album login}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret}
    ports: ["3300:3300"]
    depends_on: [inference]

volumes:
  feedback:
  archive:
  cache:
