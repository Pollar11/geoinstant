[project]
name = "geoinstant"
version = "1.0.0"
description = "Multi-stage image geolocation service (EXIF → cues → retrieval → hierarchical fusion → VLM)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "onnxruntime>=1.19",        # swap for onnxruntime-gpu on CUDA hosts
  "anthropic>=1.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",  # form uploads
  "opencv-python-headless>=4.10",  # street match: SIFT + RANSAC
]

[project.optional-dependencies]
ocr = ["rapidocr_onnxruntime>=1.3"]
faiss = ["faiss-cpu>=1.8"]
# Only needed to *build* artifacts (export models, embed the index), never at serving time.
build = ["torch>=2.3", "open_clip_torch>=2.26", "onnx>=1.16", "onnxconverter-common>=1.14", "tqdm>=4.66"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.16,<0.17", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geoinstant*"]

[tool.setuptools.package-data]
geoinstant = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode letters are data here (scripts, diacritics)

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
